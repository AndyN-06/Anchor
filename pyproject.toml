[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anchor"
version = "0.1.0"
description = "Persistent AR relocalization: map a space once, relocalize into it later."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "opencv-python>=4.8", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["anchor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
